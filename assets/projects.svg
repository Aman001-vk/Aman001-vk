<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Project cards">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .t { fill: #E2E8F0; font-size: 16px; font-weight: 700; }
      .d { fill: #94A3B8; font-size: 12.5px; }
      .tag { fill: #6366F1; font-size: 11px; }
    </style>
  </defs>

  <rect width="900" height="240" rx="14" fill="#0B1020"/>
  <rect width="900" height="240" rx="14" fill="none" stroke="#2A3352"/>

  <text x="40" y="42" class="mono" font-size="14" fill="#64748B">aman@dev:~$ ls ./projects</text>

  <g class="mono">
    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze"/>
      <rect x="40" y="62" width="400" height="72" rx="10" fill="#131B33" stroke="#2A3352"/>
      <rect x="40" y="62" width="3.5" height="72" rx="2" fill="#22D3EE"/>
      <text x="60" y="88" class="t">Codestorm</text>
      <text x="60" y="108" class="d">HealthTech platform: medicine info, diet and workout</text>
      <text x="60" y="124" class="d">plans, plus an AI symptom-to-prescription chatbot.</text>
      <text x="330" y="88" class="tag">HealthTech</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" fill="freeze"/>
      <rect x="460" y="62" width="400" height="72" rx="10" fill="#131B33" stroke="#2A3352"/>
      <rect x="460" y="62" width="3.5" height="72" rx="2" fill="#6366F1"/>
      <text x="480" y="88" class="t">Jarvis</text>
      <text x="480" y="108" class="d">A virtual assistant written from scratch in C —</text>
      <text x="480" y="124" class="d">systems-level take on a scripting-language problem.</text>
      <text x="820" y="88" class="tag">C</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.9s" fill="freeze"/>
      <rect x="40" y="146" width="400" height="72" rx="10" fill="#131B33" stroke="#2A3352"/>
      <rect x="40" y="146" width="3.5" height="72" rx="2" fill="#818CF8"/>
      <text x="60" y="172" class="t">FUTURE_ML_01 &#8594; 03</text>
      <text x="60" y="192" class="d">Three-part ML internship track across Python and</text>
      <text x="60" y="208" class="d">Jupyter: prep, modelling, evaluation, end to end.</text>
      <text x="368" y="172" class="tag">Python / ML</text>
    </g>

    <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.2s" fill="freeze"/>
      <rect x="460" y="146" width="400" height="72" rx="10" fill="#131B33" stroke="#2A3352"/>
      <rect x="460" y="146" width="3.5" height="72" rx="2" fill="#38BDF8"/>
      <text x="480" y="172" class="t">&#8230; and more</text>
      <text x="480" y="192" class="d">Nine public repositories spanning ML experiments,</text>
      <text x="480" y="208" class="d">web builds and systems practice.</text>
      <text x="786" y="172" class="tag">browse &#8594;</text>
    </g>
  </g>

  <rect x="-200" y="0" width="200" height="240" fill="url(#scan)">
    <animate attributeName="x" values="-200;900" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Tech stack proficiency bars">
  <defs>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .lbl { fill: #CBD5E1; font-size: 14px; }
      .pct { fill: #64748B; font-size: 12.5px; }
    </style>
  </defs>

  <rect width="900" height="300" rx="14" fill="#0B1020"/>
  <rect width="900" height="300" rx="14" fill="none" stroke="#2A3352"/>

  <text x="40" y="44" class="mono" font-size="14" fill="#64748B">aman@dev:~$ stack --load</text>

  <!-- row template: label | track | fill | pct -->
  <g class="mono">
    <text x="40" y="84" class="lbl">Python</text>
    <rect x="190" y="71" width="600" height="10" rx="5" fill="#1B2440"/>
    <rect x="190" y="71" width="0" height="10" rx="5" fill="url(#barA)">
      <animate attributeName="width" values="0;552" dur="1.4s" begin="0.2s" fill="freeze"/>
    </rect>
    <text x="808" y="81" class="pct" opacity="0">92%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.5s" fill="freeze"/></text>

    <text x="40" y="118" class="lbl">ML / Deep Learning</text>
    <rect x="190" y="105" width="600" height="10" rx="5" fill="#1B2440"/>
    <rect x="190" y="105" width="0" height="10" rx="5" fill="url(#barA)">
      <animate attributeName="width" values="0;504" dur="1.4s" begin="0.35s" fill="freeze"/>
    </rect>
    <text x="808" y="115" class="pct" opacity="0">84%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.65s" fill="freeze"/></text>

    <text x="40" y="152" class="lbl">JavaScript / React</text>
    <rect x="190" y="139" width="600" height="10" rx="5" fill="#1B2440"/>
    <rect x="190" y="139" width="0" height="10" rx="5" fill="url(#barA)">
      <animate attributeName="width" values="0;462" dur="1.4s" begin="0.5s" fill="freeze"/>
    </rect>
    <text x="808" y="149" class="pct" opacity="0">77%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.8s" fill="freeze"/></text>

    <text x="40" y="186" class="lbl">C / C++ / Java</text>
    <rect x="190" y="173" width="600" height="10" rx="5" fill="#1B2440"/>
    <rect x="190" y="173" width="0" height="10" rx="5" fill="url(#barA)">
      <animate attributeName="width" values="0;438" dur="1.4s" begin="0.65s" fill="freeze"/>
    </rect>
    <text x="808" y="183" class="pct" opacity="0">73%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.95s" fill="freeze"/></text>

    <text x="40" y="220" class="lbl">Databases</text>
    <rect x="190" y="207" width="600" height="10" rx="5" fill="#1B2440"/>
    <rect x="190" y="207" width="0" height="10" rx="5" fill="url(#barA)">
      <animate attributeName="width" values="0;414" dur="1.4s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="808" y="217" class="pct" opacity="0">69%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.1s" fill="freeze"/></text>

    <text x="40" y="254" class="lbl">Cloud / DevOps</text>
    <rect x="190" y="241" width="600" height="10" rx="5" fill="#1B2440"/>
    <rect x="190" y="241" width="0" height="10" rx="5" fill="url(#barA)">
      <animate attributeName="width" values="0;372" dur="1.4s" begin="0.95s" fill="freeze"/>
    </rect>
    <text x="808" y="251" class="pct" opacity="0">62%<animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.25s" fill="freeze"/></text>
  </g>

  <text x="40" y="285" class="mono" font-size="12.5" fill="#475569" opacity="0">
    done. 6 modules loaded.<animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.5s" fill="freeze"/>
  </text>
  <rect x="215" y="277" width="8" height="12" fill="#22D3EE" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="2.5s" repeatCount="indefinite"/>
  </rect>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="25%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M0 12 H300 l12 -7 l12 14 l12 -14 l12 14 l12 -7 H900" fill="none" stroke="url(#line)" stroke-width="2"
        stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" values="1400;0" dur="2.4s" fill="freeze"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="3.5s" begin="2.4s" repeatCount="indefinite"/>
  </path>
  <circle r="3.2" fill="#22D3EE" opacity="0.9">
    <animate attributeName="cx" values="0;900" dur="5s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="12;12" dur="5s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>

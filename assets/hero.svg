<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Aman Kumar — ML, Full-Stack, Cloud">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#141B34"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="nameClip">
      <rect x="60" y="60" width="0" height="60">
        <animate attributeName="width" values="0;0;470;470" keyTimes="0;0.06;0.55;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    </style>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <rect width="900" height="220" rx="14" fill="none" stroke="#2A3352" stroke-width="1"/>

  <g opacity="0.5">
    <circle cx="120" cy="40" r="2" fill="#22D3EE">
      <animate attributeName="cy" values="40;185;40" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="170" r="2.5" fill="#6366F1">
      <animate attributeName="cy" values="170;35;170" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="815" cy="70" r="1.8" fill="#22D3EE">
      <animate attributeName="cy" values="70;180;70" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="195" r="1.6" fill="#818CF8">
      <animate attributeName="cy" values="195;30;195" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="60" y="44" class="mono" font-size="14" fill="#64748B">aman@dev:~$ ./introduce --self</text>

  <g clip-path="url(#nameClip)">
    <text x="60" y="108" class="mono" font-size="46" font-weight="700" fill="url(#accent)">Aman Kumar</text>
  </g>
  <rect x="60" y="68" width="13" height="46" fill="#22D3EE" class="cursor">
    <animate attributeName="x" values="60;60;530;530" keyTimes="0;0.06;0.55;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.68;1" dur="7s" repeatCount="indefinite"/>
    <text x="62" y="148" class="mono" font-size="17" fill="#94A3B8">Machine Learning &#183; Full-Stack &#183; Cloud</text>
    <text x="62" y="176" class="mono" font-size="13.5" fill="#475569">models that ship inside real interfaces, not just notebooks</text>
  </g>

  <rect x="60" y="196" width="0" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="0;780;780" keyTimes="0;0.7;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
